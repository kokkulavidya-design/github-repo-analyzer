# Server Configuration
server.port=8080
server.servlet.context-path=/

# Default runtime profile for local development
spring.profiles.active=local

# Application Name
spring.application.name=GitHub-Repo-Analyzer

# Supabase PostgreSQL Database Configuration
# Update these values with your actual Supabase credentials
spring.datasource.url=jdbc:postgresql://db.odcszwmyaabaabpunnbgo.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=dharani15*2
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Logging Configuration
logging.level.root=INFO
logging.level.com.githubrepoanalyzer=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# GitHub API Configuration
github.api.base-url=https://api.github.com
# github.api.token=your_github_token_here (optional, for higher rate limits)
